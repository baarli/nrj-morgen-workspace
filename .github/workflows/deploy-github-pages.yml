name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Stage Mission Control web files
        id: stage
        shell: bash
        run: |
          publish_dir="$(mktemp -d "${RUNNER_TEMP}/mission-control-pages.XXXXXX")"
          cp -r mission-control/public/[!.]* "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          printf 'directory=%s\n' "$publish_dir" >> "$GITHUB_OUTPUT"
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.stage.outputs.directory }}
