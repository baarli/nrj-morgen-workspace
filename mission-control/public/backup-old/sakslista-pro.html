    <style>
        <!-- STANDARD CSS - MUST BE IDENTICAL ON ALL PAGES -->
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --dark-lighter: #334155;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-hover: rgba(255,255,255,0.03);
            --border-color: rgba(255,255,255,0.1);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, var(--dark-light) 100%);
            color: var(--text);
            min-height: 100vh;
        }
        
        <!-- STANDARD SIDEBAR -->
        .sidebar {
            width: 280px;
            background: rgba(30, 41, 59, 0.98);
            padding: 24px;
            border-right: 1px solid rgba(255,255,255,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .nav { list-style: none; }
        .nav li { margin-bottom: 8px; }
        .nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav a:hover, .nav a.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }
        .nav a i { width: 20px; text-align: center; }
        
        .main { flex: 1; margin-left: 280px; padding: 32px; }
        
        <!-- ACTIVE PROJECT WIDGET -->
        .active-project-widget {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border: 1px solid rgba(102, 126, 234, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        <!-- RESPONSIVE -->
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
        }
        
        <!-- PAGE-SPECIFIC CSS -->
        
                .sak-item { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--bg-card); border-radius: 8px; margin-bottom: 8px; }
                .sak-actions { display: flex; gap: 4px; }
                .sak-actions button { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 8px; border-radius: 6px; }
                .sak-actions button:hover { background: rgba(255,255,255,0.1); color: white; }
                .ai-suggest { background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%) !important; color: var(--primary) !important; }
            
    </style>
    <link rel="manifest" href="/manifest.json">
    <script src="dark-mode-manager.js" defer></script>
    <script src="security-manager.js" defer></script>
    <script src="test-suite.js" defer></script>
</head>

                <p style="font-size: 11px; color: #94a3b8; margin: 4px 0 0 0;">v3.1</p>

        <ul class="nav">

            <li><a href="podkast-control.html" class=""><i class="fas fa-podcast"></i> Podkast</a></li>

            <li><a href="notifications.html" class=""><i class="fas fa-bell"></i> Varsler</a></li>

        </ul>
    </aside>

    <main class="main">
        <!-- ACTIVE PROJECT WIDGET - SHOWS ON ALL PAGES -->
        <div class="active-project-widget" id="active-project-widget">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <h3 style="font-size: 14px; color: var(--text-muted); margin-bottom: 4px;">🤖 AKTIVT AUTONOMT PROSJEKT</h3>
                    <h2 style="font-size: 20px; margin-bottom: 8px;" id="active-project-name">Laster...</h2>
                    <p style="color: var(--text-muted); font-size: 14px;" id="active-project-desc">...</p>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Status</div>
                    <span class="status-badge" id="active-project-status">🟡 Venter</span>
                </div>
            </div>
        </div>

        <!-- PAGE CONTENT -->
        
                <div class="header">
                    <h2>Sakslista Pro</h2>
                    <div class="header-actions">
                        <button class="btn btn-primary" onclick="runMorningRoutine()">
                            <i class="fas fa-play"></i> Morning Routine
                        </button>
                        <button class="btn" onclick="showAddModal()">
                            <i class="fas fa-plus"></i> Ny Sak
                        </button>
                    </div>
                </div>
                
                <div id="saker-list"></div>
            
    </main>

    <script>
        <!-- STANDARD SCRIPTS - LOADED ON ALL PAGES -->
        
        // Load active project info
        async function loadActiveProject() {
            try {
                const response = await fetch('/.config/active-projects.json');
                if (response.ok) {
                    const data = await response.json();
                    if (data.projects && data.projects.length > 0) {
                        const project = data.projects[0];
                        document.getElementById('active-project-name').textContent = project.name;
                        document.getElementById('active-project-desc').textContent = project.description;
                        const statusEl = document.getElementById('active-project-status');
                        if (project.status === 'active') {
                            statusEl.textContent = '🟢 Aktiv';
                            statusEl.style.background = 'rgba(16, 185, 129, 0.2)';
                            statusEl.style.color = '#10b981';
                        } else {
                            statusEl.textContent = '✅ Fullført';
                            statusEl.style.background = 'rgba(59, 130, 246, 0.2)';
                            statusEl.style.color = '#3b82f6';
                        }
                    }
                }
            } catch (e) {
                console.log('Could not load active project');
            }
        }
        
        loadActiveProject();
        
        <!-- PAGE-SPECIFIC SCRIPTS -->
        
                // Sakslista Pro specific code
                console.log('Sakslista Pro loaded');
            
    </script>
