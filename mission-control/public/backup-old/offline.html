<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Mission Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .offline-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .offline-icon {
            font-size: 80px;
            color: #f59e0b;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            border: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }
        
        .cached-content {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .cached-content h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #e2e8f0;
        }
        
        .cached-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        
        .cached-link {
            padding: 8px 16px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 6px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .cached-link:hover {
            background: rgba(102, 126, 234, 0.3);
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 20px;
            color: #ef4444;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .status-indicator i {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .logo {
            margin-bottom: 32px;
        }
        
        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto;
        }
    </style>
    <script src="mobile-experience.js" defer></script>
    <script src="dark-mode-manager.js" defer></script>
    <script src="security-manager.js" defer></script>
    <script src="test-suite.js" defer></script>
</head>
<body>
    <div class="offline-container">
        <div class="logo">
            <div class="logo-icon">🚀</div>
        </div>
        
        <div class="status-indicator">
            <i class="fas fa-circle-notch"></i>
            <span>Venter på nettverk...</span>
        </div>
        
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        
        <h1>Du er offline</h1>
        <p>Det ser ut til at du ikke har internettforbindelse akkurat nå. Noe innhold kan fortsatt være tilgjengelig fra cache.</p>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="location.reload()">
                <i class="fas fa-sync-alt"></i>
                Prøv igjen
            </button>
            <a href="/" class="btn btn-secondary">
                <i class="fas fa-home"></i>
                Gå til forsiden
            </a>
        </div>
        
        <div class="cached-content">
            <h3><i class="fas fa-archive"></i> Tilgjengelig offline:</h3>
            <div class="cached-links">
                <a href="/total-control.html" class="cached-link">Oversikt</a>
                <a href="/sakslista-pro.html" class="cached-link">Sakslista</a>
                <a href="/analytics.html" class="cached-link">Analytics</a>
                <a href="/index.html" class="cached-link">Dashboard</a>
            </div>
        </div>
    </div>
    
    <script>
        // Check connection status
        function updateStatus() {
            const indicator = document.querySelector('.status-indicator');
            const icon = document.querySelector('.offline-icon');
            
            if (navigator.onLine) {
                indicator.innerHTML = '<i class="fas fa-check-circle"></i><span>Tilkoblet!</span>';
                indicator.style.background = 'rgba(16, 185, 129, 0.2)';
                indicator.style.color = '#10b981';
                icon.innerHTML = '<i class="fas fa-wifi" style="color: #10b981;"></i>';
                
                // Reload after 2 seconds
                setTimeout(() => {
                    location.reload();
                }, 2000);
            }
        }
        
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        
        // Check periodically
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
