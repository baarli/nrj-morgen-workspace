<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaarliClaw Mission Control</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: #e2e8f0; 
            min-height: 100vh;
        }
        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .gradient-text { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.5; } 
        }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { 
            from { transform: translateX(-20px); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-online { background: #10b981; box-shadow: 0 0 10px #10b981; }
        .status-offline { background: #ef4444; }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
    </style>
    <script src="realtime-collaboration.js" defer>
    <script src="mobile-experience.js" defer></script>
    <script src="ai-content-suggestions.js" defer></script>
    <script src="shared-navigation.js" defer></script>
    <link rel="manifest" href="/manifest.json">
    <script src="dark-mode-manager.js" defer></script>
    <script src="security-manager.js" defer></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Mock data for external deployment
        const MOCK_DATA = {
            status: {
                sessions: 31,
                skills: 5,
                scripts: 33,
                automations: 5,
                uptime: "99.9%",
                lastUpdate: new Date().toISOString()
            },
            automations: [
                { name: "Daily Pre-Flight", schedule: "Every 24h", status: "active", lastRun: "2 hours ago" },
                { name: "Session End Capture", schedule: "Every hour", status: "active", lastRun: "5 minutes ago" },
                { name: "NRJ Dashboard Update", schedule: "Wed 14:00", status: "active", nextRun: "Next Wednesday" },
                { name: "Morning Routine", schedule: "Mon-Fri 06:00", status: "active", nextRun: "Tomorrow 06:00" },
                { name: "Podcast Download", schedule: "Daily 07:00", status: "active", nextRun: "Tomorrow 07:00" }
            ],
            skills: [
                { name: "nrj-dashboard-system", description: "NRJ Dashboard management", triggers: 15 },
                { name: "self-improvement", description: "Learning and growth", triggers: 8 },
                { name: "system-manager", description: "System monitoring", triggers: 12 },
                { name: "calendar", description: "Schedule management", triggers: 5 },
                { name: "slack", description: "Slack integration", triggers: 3 }
            ],
            logs: [
                { time: "03:00:15", message: "Session end learning capture completed", type: "success" },
                { time: "02:46:05", message: "Autonomous mode activated", type: "info" },
                { time: "02:41:00", message: "Mission Control deployed", type: "success" },
                { time: "02:39:44", message: "Agent dashboard generated", type: "info" },
                { time: "02:38:00", message: "Skills packaged and installed", type: "success" }
            ]
        };
        
        // Auth Component
        const Auth = ({ onLogin }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === 'kloakontroll2026') {
                    onLogin();
                } else {
                    setError('Invalid password');
                }
            };
            
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="glass p-8 rounded-2xl shadow-2xl max-w-md w-full">
                        <div className="text-center mb-8">
                            <div className="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-r from-blue-600 to-purple-600 flex items-center justify-center">
                                <i className="fas fa-robot text-4xl text-white"></i>
                            </div>
                            <h1 className="text-3xl font-bold gradient-text mb-2">Mission Control</h1>
                            <p className="text-gray-400">BaarliClaw Agent v2.0</p>
                            <div className="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-green-900/50 border border-green-700">
                                <span className="status-dot status-online pulse"></span>
                                <span className="text-green-400 text-sm">System Online</span>
                            </div>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm text-gray-400 mb-2">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="Enter access code"
                                    className="w-full p-4 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 transition"
                                />
                            </div>
                            
                            {error && (
                                <div className="p-3 rounded-lg bg-red-900/50 border border-red-700 text-red-400 text-sm">
                                    <i className="fas fa-exclamation-circle mr-2"></i>{error}
                                </div>
                            )}
                            
                            <button 
                                type="submit" 
                                className="w-full p-4 rounded-lg bg-gradient-to-r from-blue-600 to-purple-600 font-bold hover:opacity-90 transition flex items-center justify-center gap-2"
                            >
                                <i className="fas fa-lock"></i>
                                Access Control
                            </button>
                        </form>
                        
                        <div className="mt-6 text-center text-sm text-gray-500">
                            <p>Protected Area - Authorized Access Only</p>
                        </div>
                    </div>
                </div>
            );
        };
        
        // Stat Card Component
        const StatCard = ({ icon, title, value, subtitle, color = "blue" }) => {
            const colors = {
                blue: "from-blue-600 to-blue-800",
                purple: "from-purple-600 to-purple-800",
                green: "from-green-600 to-green-800",
                orange: "from-orange-600 to-orange-800",
                red: "from-red-600 to-red-800"
            };
            
            return (
                <div className="glass p-6 rounded-xl card-hover transition-all duration-300">
                    <div className={`w-14 h-14 rounded-lg bg-gradient-to-r ${colors[color]} flex items-center justify-center mb-4`}>
                        <i className={`${icon} text-2xl text-white`}></i>
                    </div>
                    <h3 className="text-gray-400 text-sm uppercase tracking-wider mb-1">{title}</h3>
                    <p className="text-3xl font-bold text-white mb-1">{value}</p>
                    {subtitle && <p className="text-sm text-gray-500">{subtitle}</p>}
                </div>
            );
        };
        
        // Dashboard Component
        const Dashboard = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [currentTime, setCurrentTime] = useState(new Date());
            
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            
            const NavItem = ({ icon, label, tab, badge }) => (
                <button 
                    onClick={() => setActiveTab(tab)}
                    className={`w-full p-3 rounded-lg flex items-center gap-3 transition-all duration-200 ${
                        activeTab === tab 
                            ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg' 
                            : 'hover:bg-slate-800 text-gray-400 hover:text-white'
                    }`}
                >
                    <i className={`${icon} w-5`}></i>
                    <span className="flex-1 text-left">{label}</span>
                    {badge && (
                        <span className="px-2 py-1 rounded-full bg-red-600 text-xs font-bold">{badge}</span>
                    )}
                </button>
            );
            
            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    {/* Sidebar */}
                    <div className="w-full lg:w-72 glass p-6 flex flex-col">
                        <div className="mb-8">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-10 h-10 rounded-lg bg-gradient-to-r from-blue-600 to-purple-600 flex items-center justify-center">
                                    <i className="fas fa-robot text-white"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold gradient-text">Mission Control</h1>
                                    <p className="text-xs text-gray-500">v2.0 Autonomous</p>
                                </div>
                            </div>
                            
                            <div className="text-xs text-gray-500 font-mono">
                                {currentTime.toLocaleTimeString()}
                            </div>
                        </div>
                        
                        <nav className="space-y-2 flex-1">
                            <NavItem icon="fas fa-chart-line" label="Overview" tab="overview" />
                            <NavItem icon="fas fa-terminal" label="Live Logs" tab="logs" />
                            <NavItem icon="fas fa-cogs" label="Automations" tab="automations" />
                            <NavItem icon="fas fa-brain" label="Skills" tab="skills" />
                            <NavItem icon="fas fa-shield-alt" label="Security" tab="security" />
                        </nav>
                        
                        <div className="mt-6 p-4 rounded-lg bg-green-900/30 border border-green-700/50">
                            <div className="flex items-center gap-2 mb-2">
                                <span className="status-dot status-online pulse"></span>
                                <span className="text-green-400 font-semibold text-sm">Autonomous Mode</span>
                            </div>
                            <p className="text-xs text-gray-400"
                                dangerouslySetInnerHTML={{
                                    __html: `Uptime: ${MOCK_DATA.status.uptime}<br/>Last update: ${new Date(MOCK_DATA.status.lastUpdate).toLocaleTimeString()}`
                                }}
                            />
                        </div>
                    </div>
                    
                    {/* Main Content */}
                    <div className="flex-1 p-4 lg:p-8 overflow-auto">
                        {activeTab === 'overview' && (
                            <div className="slide-in space-y-6">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-2xl font-bold">System Overview</h2>
                                    <button className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition text-sm">
                                        <i className="fas fa-sync-alt mr-2"></i>Refresh
                                    </button>
                                </div>
                                
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                    <StatCard icon="fas fa-comments" title="Sessions" value={MOCK_DATA.status.sessions} subtitle="Total interactions" color="blue" />
                                    <StatCard icon="fas fa-graduation-cap" title="Skills" value={MOCK_DATA.status.skills} subtitle="Active capabilities" color="purple" />
                                    <StatCard icon="fas fa-code" title="Scripts" value={MOCK_DATA.status.scripts} subtitle="Automation tools" color="green" />
                                    <StatCard icon="fas fa-robot" title="Automations" value={MOCK_DATA.status.automations} subtitle="Running jobs" color="orange" />
                                </div>
                                
                                <div className="grid lg:grid-cols-2 gap-6">
                                    <div className="glass p-6 rounded-xl">
                                        <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                                            <i className="fas fa-cogs text-blue-400"></i>
                                            Active Automations
                                        </h3>
                                        <div className="space-y-3">
                                            {MOCK_DATA.automations.slice(0, 3).map((job, i) => (
                                                <div key={i} className="flex items-center justify-between p-3 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition">
                                                    <div>
                                                        <p className="font-semibold text-sm">{job.name}</p>
                                                        <p className="text-xs text-gray-500">{job.schedule}</p>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="px-2 py-1 rounded-full bg-green-900/50 text-green-400 text-xs">
                                                            {job.status}
                                                        </span>
                                                        <p className="text-xs text-gray-500 mt-1">{job.lastRun || job.nextRun}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button 
                                            onClick={() => setActiveTab('automations')}
                                            className="w-full mt-4 p-3 rounded-lg bg-slate-800 hover:bg-slate-700 transition text-sm text-gray-400"
                                        >
                                            View All Automations →
                                        </button>
                                    </div>
                                    
                                    <div className="glass p-6 rounded-xl">
                                        <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                                            <i className="fas fa-heartbeat text-green-400"></i>
                                            System Health
                                        </h3>
                                        <div className="space-y-3">
                                            {[
                                                { name: 'Auto-Exec Enforcer', status: 'ok', icon: 'fa-shield-alt' },
                                                { name: 'Memory Validator', status: 'ok', icon: 'fa-brain' },
                                                { name: 'Session Handler', status: 'ok', icon: 'fa-clock' },
                                                { name: 'Autonomous Mode', status: 'ok', icon: 'fa-robot' },
                                                { name: 'Web Server', status: 'ok', icon: 'fa-server' }
                                            ].map((item, i) => (
                                                <div key={i} className="flex items-center justify-between p-3 rounded-lg bg-slate-800/50">
                                                    <div className="flex items-center gap-3">
                                                        <i className={`fas ${item.icon} text-gray-500`}></i>
                                                        <span className="text-sm">{item.name}</span>
                                                    </div>
                                                    <i className="fas fa-check-circle text-green-400"></i>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'logs' && (
                            <div className="slide-in">
                                <div className="flex items-center justify-between mb-6">
                                    <h2 className="text-2xl font-bold">Live Logs</h2>
                                    <div className="flex gap-2">
                                        <button className="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition text-sm">
                                            <i className="fas fa-filter mr-2"></i>Filter
                                        </button>
                                        <button className="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition text-sm">
                                            <i className="fas fa-download mr-2"></i>Export
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="glass rounded-xl overflow-hidden">
                                    <div className="p-4 bg-slate-800/50 border-b border-slate-700 flex items-center gap-2">
                                        <span className="w-3 h-3 rounded-full bg-green-500 pulse"></span>
                                        <span className="text-sm text-gray-400">Live stream active</span>
                                    </div>
                                    
                                    <div className="p-4 font-mono text-sm space-y-2 max-h-96 overflow-y-auto">
                                        {MOCK_DATA.logs.map((log, i) => (
                                            <div key={i} className="flex gap-4 p-2 rounded hover:bg-slate-800/30 transition">
                                                <span className="text-gray-500 shrink-0">[{log.time}]</span>
                                                <span className={`${
                                                    log.type === 'success' ? 'text-green-400' : 
                                                    log.type === 'error' ? 'text-red-400' : 'text-blue-400'
                                                }`}>
                                                    {log.message}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'automations' && (
                            <div className="slide-in">
                                <h2 className="text-2xl font-bold mb-6">Automation Control</h2>
                                
                                <div className="grid gap-4">
                                    {MOCK_DATA.automations.map((auto, i) => (
                                        <div key={i} className="glass p-6 rounded-xl flex flex-col lg:flex-row lg:items-center justify-between gap-4"
003e
                                            <div className="flex items-start gap-4">
                                                <div className="w-12 h-12 rounded-lg bg-gradient-to-r from-blue-600 to-purple-600 flex items-center justify-center shrink-0">
                                                    <i className="fas fa-cog text-white"></i>
                                                </div>
                                                <div>
                                                    <h3 className="text-lg font-bold">{auto.name}</h3>
                                                    <p className="text-gray-400">{auto.schedule}</p>
                                                    <p className="text-sm text-gray-500 mt-1">
                                                        {auto.lastRun ? `Last run: ${auto.lastRun}` : `Next run: ${auto.nextRun}`}
                                                    </p>
                                                </div>
                                            </div>
                                            
                                            <div className="flex items-center gap-3">
                                                <span className={`px-4 py-2 rounded-full text-sm font-semibold ${
                                                    auto.status === 'active' 
                                                        ? 'bg-green-900/50 text-green-400 border border-green-700' 
                                                        : 'bg-gray-800 text-gray-400'
                                                }`}>
                                                    {auto.status}
                                                </span>
                                                <button className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition">
                                                    <i className="fas fa-play text-green-400"></i>
                                                </button>
                                                <button className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition">
                                                    <i className="fas fa-cog"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'skills' && (
                            <div className="slide-in">
                                <h2 className="text-2xl font-bold mb-6">Agent Skills</h2>
                                
                                <div className="grid md:grid-cols-2 gap-4">
                                    {MOCK_DATA.skills.map((skill, i) => (
                                        <div key={i} className="glass p-6 rounded-xl card-hover transition">
                                            <div className="flex items-start justify-between mb-4">
                                                <div className="w-12 h-12 rounded-lg bg-gradient-to-r from-purple-600 to-pink-600 flex items-center justify-center">
                                                    <i className="fas fa-brain text-white"></i>
                                                </div>
                                                <span className="px-3 py-1 rounded-full bg-blue-900/50 text-blue-400 text-xs font-semibold">
                                                    {skill.triggers} triggers
                                                </span>
                                            </div>
                                            
                                            <h3 className="text-lg font-bold mb-2">{skill.name}</h3>
                                            <p className="text-gray-400 text-sm mb-4">{skill.description}</p>
                                            
                                            <div className="flex items-center gap-2 text-sm text-gray-500">
                                                <i className="fas fa-check-circle text-green-400"></i>
                                                <span>Active</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'security' && (
                            <div className="slide-in">
                                <h2 className="text-2xl font-bold mb-6">Security Status</h2>
                                
                                <div className="grid lg:grid-cols-2 gap-6">
                                    <div className="glass p-6 rounded-xl">
                                        <div className="flex items-center gap-4 mb-6">
                                            <div className="w-16 h-16 rounded-full bg-gradient-to-r from-green-600 to-emerald-600 flex items-center justify-center">
                                                <i className="fas fa-shield-alt text-3xl text-white"></i>
                                            </div>
                                            <div>
                                                <h3 className="text-2xl font-bold text-green-400">Secure</h3>
                                                <p className="text-gray-400">All systems protected</p>
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-3">
                                            {[
                                                { name: 'Authentication', value: 'Password Protected', status: 'good' },
                                                { name: 'Auto-Exec Enforcer', value: 'Active', status: 'good' },
                                                { name: 'Memory Validation', value: 'Quiz Required', status: 'good' },
                                                { name: 'Session Logging', value: 'Enabled', status: 'good' },
                                                { name: 'Autonomous Mode', value: 'Running', status: 'good' }
                                            ].map((item, i) => (
                                                <div key={i} className="flex items-center justify-between p-4 rounded-lg bg-slate-800/50">
                                                    <span className="text-gray-300">{item.name}</span>
                                                    <span className="text-green-400 font-semibold">{item.value}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <div className="glass p-6 rounded-xl">
                                        <h3 className="text-lg font-bold mb-4">Access Log</h3>
                                        <div className="space-y-3">
                                            {[
                                                { time: '03:00:15', action: 'Session end capture', ip: 'local' },
                                                { time: '02:46:05', action: 'Autonomous mode start', ip: 'local' },
                                                { time: '02:41:00', action: 'Mission Control access', ip: 'admin' },
                                                { time: '02:39:44', action: 'Dashboard generated', ip: 'system' }
                                            ].map((log, i) => (
                                                <div key={i} className="flex items-center justify-between p-3 rounded-lg bg-slate-800/50 text-sm">
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-gray-500 font-mono">{log.time}</span>
                                                        <span className="text-gray-300">{log.action}</span>
                                                    </div>
                                                    <span className="text-gray-500">{log.ip}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };
        
        // Main App
        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            
            return isAuthenticated ? <Dashboard /> : <Auth onLogin={() => setIsAuthenticated(true)} />;
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
<script src="auto-nav.js"></script>
    <script src="pwa-manager.js" defer></script>
</body>
</html>
