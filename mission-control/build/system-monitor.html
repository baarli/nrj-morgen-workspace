<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mission Control - System Monitor</title><meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate"><meta http-equiv="Expires" content="3600"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript><script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script><style>*{margin:0;padding:0;box-sizing:border-box}:root{--primary:#667eea;--primary-dark:#764ba2;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;--dark:#0f172a;--dark-light:#1e293b;--text:#e2e8f0;--text-muted:#94a3b8;--text-dim:#64748b}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,var(--dark) 0%,var(--dark-light) 100%);color:var(--text);min-height:100vh}.container{display:flex;min-height:100vh}.sidebar{width:280px;background:rgba(30,41,59,.98);padding:24px;border-right:1px solid rgba(255,255,255,.1);position:fixed;height:100vh;overflow-y:auto;z-index:100}.logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.1)}.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}.nav{list-style:none}.nav li{margin-bottom:8px}.nav a{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;color:var(--text-muted);text-decoration:none;transition:all .2s}.nav a:hover,.nav a.active{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:white}.main{flex:1;margin-left:280px;padding:32px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.header h2{font-size:28px}.status-badge{padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600}.status-ok{background:rgba(16,185,129,.2);color:var(--success)}.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:32px}.metric-card{background:rgba(30,41,59,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:24px}.metric-card h3{font-size:14px;color:var(--text-muted);margin-bottom:16px;text-transform:uppercase}.metric-value{font-size:36px;font-weight:bold;margin-bottom:8px}.metric-bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:12px}.metric-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}.charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-bottom:32px}.chart-card{background:rgba(30,41,59,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:24px}.chart-card h3{font-size:16px;margin-bottom:20px}.chart-container{position:relative;height:200px}.log-container{background:rgba(15,23,42,.5);border-radius:8px;padding:16px;max-height:300px;overflow-y:auto;font-family:monospace;font-size:13px}.log-entry{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}.log-time{color:var(--text-dim);margin-right:12px}.log-info{color:var(--info)}.log-error{color:var(--danger)}.log-success{color:var(--success)}.notification-container{position:fixed;top:20px;right:20px;z-index:1001}@media(max-width:1200px){.metrics-grid{grid-template-columns:repeat(2,1fr)}.charts-grid{grid-template-columns:1fr}}@media(max-width:768px){.sidebar{display:none}.main{margin-left:0}.metrics-grid{grid-template-columns:1fr}}</style></head><body><div class="container"><aside class="sidebar"><div class="logo"><div class="logo-icon">🚀</div><div class="logo-text"><h1>Mission Control</h1></div></div><ul class="nav"><li><a href="total-control.html"><i class="fas fa-home"></i> Oversikt</a></li><li><a href="sakslista-pro.html"><i class="fas fa-list"></i> Saker</a></li><li><a href="podkast-control.html"><i class="fas fa-podcast"></i> Podkast</a></li><li><a href="agent-control.html"><i class="fas fa-robot"></i> Agent</a></li><li><a href="cron-control.html"><i class="fas fa-clock"></i> Cron</a></li><li><a href="git-control.html"><i class="fas fa-code-branch"></i> Git</a></li><li><a href="system-monitor.html" class="active"><i class="fas fa-server"></i> System</a></li><li><a href="innstillinger.html"><i class="fas fa-cog"></i> Innstillinger</a></li></ul></aside><main class="main"><div class="header"><h2>System Monitor</h2><div style="display:flex;gap:12px;align-items:center"><span class="status-badge status-ok" id="system-status">🟢 System OK</span><button onclick="refreshMetrics()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px"><i class="fas fa-sync"></i></button></div></div><div class="metrics-grid"><div class="metric-card"><h3>CPU Bruk</h3><div class="metric-value" id="cpu-value">--%</div><div class="metric-bar"><div class="metric-bar-fill" id="cpu-bar" style="width:0%;background:var(--primary)"></div></div></div><div class="metric-card"><h3>Minne Bruk</h3><div class="metric-value" id="mem-value">--%</div><div class="metric-bar"><div class="metric-bar-fill" id="mem-bar" style="width:0%;background:var(--info)"></div></div></div><div class="metric-card"><h3>Disk Bruk</h3><div class="metric-value" id="disk-value">--%</div><div class="metric-bar"><div class="metric-bar-fill" id="disk-bar" style="width:0%;background:var(--success)"></div></div></div></div><div class="charts-grid"><div class="chart-card"><h3>CPU over tid</h3><div class="chart-container"><canvas id="cpuChart"></canvas></div></div><div class="chart-card"><h3>Minne over tid</h3><div class="chart-container"><canvas id="memChart"></canvas></div></div></div><div class="chart-card"><h3>System Logger</h3><div class="log-container" id="log-container"><div class="log-entry"><span class="log-time">--:--:--</span><span class="log-info">System monitor startet...</span></div></div></div></main></div><div class="notification-container" id="notification-container"></div><script>let cpuChart,memChart;document.addEventListener('DOMContentLoaded',()=>{Chart.defaults.color='#94a3b8';Chart.defaults.borderColor='rgba(255,255,255,.1)';cpuChart=new Chart(document.getElementById('cpuChart'),{type:'line',data:{labels:[],datasets:[{label:'CPU %',data:[],borderColor:'#667eea',tension:.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}});memChart=new Chart(document.getElementById('memChart'),{type:'line',data:{labels:[],datasets:[{label:'Minne %',data:[],borderColor:'#3b82f6',tension:.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100}}}});loadMetrics()});function loadMetrics(){const cpu=Math.floor(Math.random()*30)+10,mem=Math.floor(Math.random()*20)+40,disk=78;document.getElementById('cpu-value').textContent=`${cpu}%`;document.getElementById('cpu-bar').style.width=`${cpu}%`;document.getElementById('mem-value').textContent=`${mem}%`;document.getElementById('mem-bar').style.width=`${mem}%`;document.getElementById('disk-value').textContent=`${disk}%`;document.getElementById('disk-bar').style.width=`${disk}%`;updateCharts(cpu,mem)}function updateCharts(cpu,mem){const now=new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'});cpuChart.data.labels.length>20&&(cpuChart.data.labels.shift(),cpuChart.data.datasets[0].data.shift());cpuChart.data.labels.push(now);cpuChart.data.datasets[0].data.push(cpu);cpuChart.update();memChart.data.labels.length>20&&(memChart.data.labels.shift(),memChart.data.datasets[0].data.shift());memChart.data.labels.push(now);memChart.data.datasets[0].data.push(mem);memChart.update()}function refreshMetrics(){loadMetrics();showNotification('Metrics oppdatert','success')}function showNotification(message,type){const container=document.getElementById('notification-container'),notif=document.createElement('div');notif.style.cssText=`padding:16px 20px;background:rgba(30,41,59,.98);border-radius:8px;margin-bottom:8px;border-left:4px solid ${type==='success'?'var(--success)':'var(--info)'};animation:slideIn .3s ease`;notif.textContent=message;container.appendChild(notif);setTimeout(()=>notif.remove(),3000)}setInterval(loadMetrics,3e4)</script></body></html>
